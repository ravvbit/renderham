# SPDX-License-Identifier: MIT
# Copyright (c) 2026 rawbit (@ravvbit). AI-generated with Claude (Anthropic) under human direction; see README.md.
#
# Builds and tests renderHAM on Linux, Windows and macOS and packages it: Debian package (.deb),
# AppImage and Flatpak for x86_64 Linux, a ZIP file for 64-bit Windows and a disk image (.dmg) for
# macOS (Intel and Apple Silicon in one). On every push to main and on pull requests the packages are
# built and offered as workflow artifacts; a version tag (v0.2.0, ...) additionally creates a draft
# GitHub release with all of them.
#
# Releasing: bump the version in CMakeLists.txt, add a <release> entry to
# packaging/linux/io.github.ravvbit.renderham.metainfo.xml and a section to CHANGELOG.md, commit, then
#   git tag -a v0.2.0 -m "renderHAM 0.2.0" && git push origin v0.2.0
# The release is created as a draft; review it on GitHub and publish it there.
#
# Linux: the Debian package and the AppImage are built in an Ubuntu 22.04 container (the base of Linux
# Mint 21, glibc 2.35) with a static wxWidgets 3.2 that is built once and cached; then both are
# installed and started on clean Ubuntu 22.04, Ubuntu 24.04 and Debian 12 systems.
# Besides the packages there is the source tarball (scripts/make_source_tarball.sh) and the scripts
# for building and installing from it on any distribution (scripts/install_dependencies.sh, build.sh,
# install.sh, uninstall.sh): the "source" job makes the tarball and runs the scripts on the runner
# (a normal user with sudo); the "linux-scripts" jobs run them in containers of Ubuntu, Debian,
# Fedora, Rocky Linux, Arch Linux and openSUSE. The latter are not a condition for a release: the
# rolling distributions change under us, and the draft release is reviewed by a person anyway.
#
# Windows: MinGW-w64 from MSYS2 (UCRT64); the ZIP carries the DLLs the programs need. It is built with
# MSYS2's wxWidgets 3.3 because wxWidgets 3.2 has no dark mode on Windows (see main.cpp). The
# GUI is started with the light and the dark setting of Windows, and with a setting changed while it
# runs; the macOS job starts it light and dark, too. The screenshots are workflow artifacts.
#
# macOS: the job runs on GitHub's last Intel runner image, so the tests run the Intel part of the
# programs; the Apple Silicon part is compiled and linked but not run. (GitHub did not give this
# repository an Apple Silicon runner within 15 minutes on three tries - macos-latest, macos-15 and
# macos-26 - so a native job could not be added. Try again with `runs-on: macos-15`.) The Intel runner
# images are announced to end in August 2027. Homebrew has no Intel packages of wxWidgets 3.2, so it is
# built from the source tarball here (the same version and checksum as in the Flatpak manifest), as a
# static universal library, and cached. The first run on a new version takes a while (about 20
# minutes); later runs restore the cache.
#
# Actions are pinned to commit SHAs (the comment names the version); update them deliberately.
name: Build and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release build half-way through.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ gettext libwxgtk3.2-dev desktop-file-utils appstream

      - name: Validate the desktop entry and the AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.ravvbit.renderham.desktop
          appstreamcli validate --no-net --pedantic packaging/linux/io.github.ravvbit.renderham.metainfo.xml

      - name: Check that tag, CMake version, AppStream release and changelog agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^project(renderham VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          meta_version="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
                          packaging/linux/io.github.ravvbit.renderham.metainfo.xml | head -n 1)"
          status=0
          [ "$tag_version" = "$cmake_version" ] || { echo "::error::tag is $tag_version but CMakeLists.txt says $cmake_version"; status=1; }
          [ "$tag_version" = "$meta_version" ] || { echo "::error::tag is $tag_version but the newest AppStream <release> is $meta_version"; status=1; }
          grep -q "^## \[$tag_version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag_version"; status=1; }
          exit "$status"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Debian package and the AppImage are built on Ubuntu 22.04 (in a container on the runner), so
  # that they run on Linux Mint 21 and newer: a program built on a newer system needs that system's C
  # library. Ubuntu 22.04 only has wxWidgets 3.0, so wxWidgets 3.2 is built from source as a static
  # library once and cached.
  wx-linux:
    name: wxWidgets for Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ubuntu:22.04
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential pkg-config libgtk-3-dev libsm-dev libxtst-dev curl ca-certificates bzip2 zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore wxWidgets from the cache
        id: wx-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /opt/wxwidgets
          key: wxwidgets-linux-ubuntu22.04-${{ hashFiles('scripts/build_wx_linux.sh') }}

      - name: Build wxWidgets
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_wx_linux.sh /opt/wxwidgets

  deb:
    name: Debian package
    needs: wx-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:22.04
    env:
      # Goes into the package's control file; change it to your preferred name and address.
      DEB_MAINTAINER: "rawbit <359580139+ravvbit@users.noreply.github.com>"
      WX_CONFIG: /opt/wxwidgets/bin/wx-config
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake make g++ binutils gettext pkg-config libgtk-3-dev libsm-dev libxtst-dev \
            dpkg-dev help2man lintian xvfb xauth desktop-file-utils ca-certificates zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /opt/wxwidgets
          key: wxwidgets-linux-ubuntu22.04-${{ hashFiles('scripts/build_wx_linux.sh') }}
          fail-on-cache-miss: true

      - name: Build the package
        run: ./scripts/build_deb.sh

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install the package and start the programs
        run: |
          apt-get install -y ./dist/renderham_*_amd64.deb
          renderHAM --version
          desktop-file-validate /usr/share/applications/io.github.ravvbit.renderham.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.ravvbit.renderham.svg
          status=0
          timeout 10 xvfb-run -a renderHAMgui || status=$?
          # 124 means: still running when the timeout stopped it, i.e. it started fine.
          [ "$status" -eq 124 ] || { echo "::error::renderHAMgui exited early with status $status"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/renderham_*_amd64.deb
          if-no-files-found: error

  appimage:
    name: AppImage
    needs: wx-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:22.04
    env:
      WX_CONFIG: /opt/wxwidgets/bin/wx-config
      # The container has no FUSE; the AppImage tools and the AppImage itself unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake make g++ gettext pkg-config libgtk-3-dev libsm-dev libxtst-dev librsvg2-dev \
            dpkg-dev curl ca-certificates file desktop-file-utils xvfb xauth zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /opt/wxwidgets
          key: wxwidgets-linux-ubuntu22.04-${{ hashFiles('scripts/build_wx_linux.sh') }}
          fail-on-cache-miss: true

      - name: Build the AppImage
        run: ./scripts/build_appimage.sh

      - name: Start the AppImage
        run: |
          status=0
          timeout 15 xvfb-run -a ./dist/renderHAM-*-x86_64.AppImage || status=$?
          [ "$status" -eq 124 ] || { echo "::error::the AppImage exited early with status $status"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/renderHAM-*-x86_64.AppImage
          if-no-files-found: error

  # The finished Linux packages, installed and started on clean systems: the oldest one they are meant
  # for (Ubuntu 22.04, the base of Linux Mint 21), the next Ubuntu LTS release, and Debian 12.
  linux-compat:
    name: Linux packages on ${{ matrix.image }}
    needs: [deb, appimage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: pkg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: pkg

      - name: Debian package
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" "${{ matrix.image }}" bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /pkg/renderham_*_amd64.deb xvfb xauth
            renderHAM --version
            status=0
            timeout 10 xvfb-run -a renderHAMgui || status=$?
            [ "$status" -eq 124 ]
          '

      - name: AppImage
        run: |
          chmod +x pkg/renderHAM-*-x86_64.AppImage   # artifacts lose the executable bit
          docker run --rm -v "$PWD/pkg:/pkg:ro" -e APPIMAGE_EXTRACT_AND_RUN=1 "${{ matrix.image }}" bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # The AppImage brings the GTK stack but not what every desktop system has anyway: the X11 and
            # Wayland client libraries, fonts and text shaping (fontconfig, FreeType, HarfBuzz, FriBidi)
            # and the MIME database. This is that list and nothing more.
            apt-get install -y -qq --no-install-recommends xvfb xauth libx11-6 libxext6 libfontconfig1 libfreetype6 \
              libharfbuzz0b libfribidi0 libwayland-client0 shared-mime-info ca-certificates
            status=0
            timeout 15 xvfb-run -a /pkg/renderHAM-*-x86_64.AppImage || status=$?
            [ "$status" -eq 124 ]
          '

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # Has flatpak-builder and the GNOME runtime tooling; the tag matches runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
      volumes:
        # The image carries the GNOME runtime in /var/lib/flatpak. Whenever the runtime has had an update
        # since the image was built, flatpak updates it by renaming directories of the image's layer, and
        # overlayfs refuses that with "Invalid cross-device link" ("Failed to update org.gnome.Sdk"): a
        # build that failed now and then, depending on the day. An anonymous volume starts with the
        # image's content at that path but is a plain directory, where renaming works.
        - /var/lib/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/linux/flatpak/io.github.ravvbit.renderham.yml
          bundle: renderHAM-x86_64.flatpak
          arch: x86_64
          # The cache keeps the wxWidgets build (the slow part) between runs.
          cache-key: flatpak-builder-${{ hashFiles('packaging/linux/flatpak/io.github.ravvbit.renderham.yml') }}
          artifact-name: flatpak

  # The oldest wxWidgets the GUI is meant to build with (the README says 3.0): the one of Ubuntu 22.04.
  wx30:
    name: Build with wxWidgets 3.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:22.04
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake make g++ gettext libwxgtk3.0-gtk3-dev ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Check that the GUI was built
        run: test -x build/tools/renderhamgui/renderHAMgui && wx-config --version

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The source tarball, as a release has it. The scripts for building and installing are tried on it
  # as a normal user with sudo, which is how a person uses them.
  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make the tarball
        run: |
          ./scripts/make_source_tarball.sh --output-dir dist
          tar -tzf dist/renderham-*.tar.gz | grep -q '/scripts/build\.sh$'
          if tar -tzf dist/renderham-*.tar.gz | grep -q '/\.github/'; then
            echo "::error::the tarball contains the CI configuration"; exit 1
          fi

      - name: Unpack, install the dependencies, build and test
        run: |
          mkdir "$RUNNER_TEMP/src"
          tar -xzf dist/renderham-*.tar.gz -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP"/src/renderham-*/
          ./scripts/install_dependencies.sh --yes
          ./scripts/build.sh --test --require-gui

      - name: Install, run and uninstall (system-wide with sudo, and for the user alone)
        run: |
          cd "$RUNNER_TEMP"/src/renderham-*/
          find /usr/local -type f ! -path '/usr/local/share/applications/*.cache' | sort > "$RUNNER_TEMP/before"
          ./scripts/install.sh
          /usr/local/bin/renderHAM --version
          test -f /usr/local/bin/translations/de/LC_MESSAGES/renderhamgui.mo
          test -f /usr/local/share/renderham/install_manifest.txt
          ./scripts/uninstall.sh
          find /usr/local -type f ! -path '/usr/local/share/applications/*.cache' | sort > "$RUNNER_TEMP/after"
          diff "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
          # Into a copy of the home directory, so that the runner's own is left alone.
          export HOME="$RUNNER_TEMP/home"
          mkdir "$HOME"
          ./scripts/install.sh --user
          "$HOME/.local/bin/renderHAM" --version
          ./scripts/uninstall.sh --user
          [ -z "$(find "$HOME/.local" -type f ! -path '*/share/applications/*.cache')" ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/renderham-*.tar.gz
          if-no-files-found: error

  # The same scripts on other distributions, from the tarball, in a container each (as root, so
  # without sudo; .github/scripts/test-linux-scripts.sh says what is checked).
  linux-scripts:
    name: Scripts on ${{ matrix.name }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 22.04 (wxWidgets 3.0)", image: "ubuntu:22.04" }
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04" }
          - { name: "Debian 12", image: "debian:12" }
          - { name: "Fedora", image: "fedora:latest" }
          - { name: "Rocky Linux 9 (EPEL)", image: "rockylinux:9" }
          - { name: "Arch Linux", image: "archlinux:latest" }
          - { name: "openSUSE Tumbleweed", image: "opensuse/tumbleweed:latest" }
          - { name: "openSUSE Leap", image: "opensuse/leap:latest" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: pkg

      - name: Build and install from the tarball
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/.github/scripts:/ci:ro" "${{ matrix.image }}" \
            bash /ci/test-linux-scripts.sh

  windows:
    name: Windows (MinGW-w64, UCRT)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build the ZIP file
        run: ./scripts/package_windows.sh build dist

      # Without MSYS2 on the path, so that the ZIP file has to bring every DLL itself.
      - name: Unpack the ZIP file and start the programs
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory -Path smoke | Out-Null
          Expand-Archive -Path (Get-ChildItem dist\renderHAM-*-windows-x64.zip).FullName -DestinationPath smoke
          $dir = (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          Get-ChildItem $dir | Format-Table Name, Length

          # The license texts of the DLLs have to be in the ZIP file.
          foreach ($f in "LICENSE", "THIRD_PARTY_NOTICES.md", "licenses\PACKAGES.txt") {
            if (-not (Test-Path -LiteralPath "$dir\$f")) { throw "$f is not in the ZIP file" }
          }
          $texts = Get-ChildItem "$dir\licenses" -Recurse -File | Where-Object Name -ne "PACKAGES.txt"
          Write-Host "$($texts.Count) license files in licenses\"
          if ($texts.Count -lt 3) { throw "too few license files in the ZIP file" }
          $wxText = $texts | Where-Object { $_.FullName -match "wxwidgets" }
          if (-not $wxText) { throw "no wxWidgets license text in the ZIP file" }

          & "$dir\renderHAM.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "renderHAM.exe --version failed with $LASTEXITCODE" }

          # A conversion to a file name with a non-ASCII character (u umlaut).
          $out = Join-Path $PWD ("Ausgabe-" + [char]0x00FC + ".iff")
          & "$dir\renderHAM.exe" -i "$PWD\testdata\test_input.png" -o $out
          if ($LASTEXITCODE -ne 0) { throw "the conversion failed with $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $out)) { throw "the output file was not written" }

          # The GUI with a picture, a few seconds to come up and to convert (F5), then a screenshot -
          # once with the light and once with the dark setting of Windows, and once more with the
          # setting changed while the program is running.
          New-Item -ItemType Directory -Path screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Win32 -Name Native -MemberDefinition '[DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern IntPtr SendMessageTimeout(IntPtr hWnd, uint Msg, UIntPtr wParam, string lParam, uint flags, uint timeout, out UIntPtr result);'
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $personalize -Force | Out-Null

          function Set-Theme($mode) {
            $value = if ($mode -eq "dark") { 0 } else { 1 }
            Set-ItemProperty -Path $personalize -Name AppsUseLightTheme -Value $value -Type DWord
            Set-ItemProperty -Path $personalize -Name SystemUsesLightTheme -Value $value -Type DWord
          }
          # What the settings page does after it has changed the theme.
          function Send-ThemeChange {
            $result = [UIntPtr]::Zero
            [void][Win32.Native]::SendMessageTimeout([IntPtr]0xffff, 0x001A, [UIntPtr]::Zero, "ImmersiveColorSet", 2, 5000, [ref]$result)
          }
          function Save-Screenshot($name) {
            $area = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $area.Width, $area.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($area.Left, $area.Top, 0, 0, $bitmap.Size)
            $bitmap.Save("$PWD\screenshots\windows-gui-$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          function Start-Gui {
            $gui = Start-Process -FilePath "$dir\renderHAMgui.exe" -ArgumentList "`"$PWD\testdata\test_input.png`"" -PassThru
            Start-Sleep -Seconds 8
            if (-not $gui.HasExited) {
              try { [System.Windows.Forms.SendKeys]::SendWait("{F5}") } catch { Write-Host "SendKeys: $_" }
              Start-Sleep -Seconds 6
            }
            return $gui
          }
          function Stop-Gui($gui, $name) {
            if ($gui.HasExited) { throw "renderHAMgui.exe quit early with code $($gui.ExitCode) ($name)" }
            Stop-Process -Id $gui.Id -Force
            Start-Sleep -Seconds 2
          }

          foreach ($mode in "light", "dark") {
            Set-Theme $mode
            $gui = Start-Gui
            Save-Screenshot $mode
            Stop-Gui $gui $mode
          }

          Set-Theme "light"
          $gui = Start-Gui
          Set-Theme "dark"
          Send-ThemeChange
          Start-Sleep -Seconds 5
          Save-Screenshot "light-to-dark"
          Stop-Gui $gui "light-to-dark"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/renderHAM-*-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot-windows
          path: screenshots/
          if-no-files-found: ignore

  macos:
    name: macOS (Intel + Apple Silicon)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # The oldest macOS the build targets; wxWidgets and renderHAM are built for the same one.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      WX_VERSION: "3.2.12"
      # Keep in step with packaging/linux/flatpak/io.github.ravvbit.renderham.yml.
      WX_SHA256: a62719bb5e1dcc41c1a6fc1eecd499c7ee8521f70402c7b1bb3342a1e16344e0
      WX_PREFIX: ${{ github.workspace }}/wx-prefix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install ninja gettext

      - name: Restore wxWidgets
        id: wx-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.WX_PREFIX }}
          key: wxwidgets-${{ env.WX_VERSION }}-macos-universal-target${{ env.MACOSX_DEPLOYMENT_TARGET }}-v1

      - name: Build wxWidgets
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wx.tar.bz2 \
            "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
          echo "${WX_SHA256}  wx.tar.bz2" | shasum -a 256 -c -
          tar xjf wx.tar.bz2
          cd "wxWidgets-${WX_VERSION}"
          # Static and universal (Intel and Apple Silicon in one), with the bundled copies of the
          # image and compression libraries (nothing from Homebrew ends up in the program), and
          # without the libraries renderHAMgui does not use.
          ./configure --prefix="${WX_PREFIX}" \
            --disable-shared --enable-unicode --disable-sys-libs \
            --enable-universal_binary=x86_64,arm64 \
            --with-macosx-version-min="${MACOSX_DEPLOYMENT_TARGET}" \
            --disable-tests --disable-stc --disable-richtext --disable-ribbon --disable-propgrid \
            --disable-aui --disable-xrc --disable-html --disable-htmlhelp --disable-webview \
            --disable-mediactrl --without-opengl
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # The application contains wxWidgets, so it carries the license texts of wxWidgets and of the
      # libraries bundled with it. They are taken from the source archive on every run (also when the
      # built library comes from the cache, which has no copy), and package_macos.sh puts them in
      # the application.
      - name: License texts of wxWidgets
        run: |
          if [ ! -d "wxWidgets-${WX_VERSION}" ]; then
            curl -fsSL -o wx.tar.bz2 \
              "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
            echo "${WX_SHA256}  wx.tar.bz2" | shasum -a 256 -c -
            tar xjf wx.tar.bz2
          fi
          ./scripts/install_wx_licences.sh "wxWidgets-${WX_VERSION}" "${RUNNER_TEMP}/wx-licences"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DwxWidgets_CONFIG_EXECUTABLE="${WX_PREFIX}/bin/wx-config" \
            -DMSGFMT_EXECUTABLE="$(brew --prefix gettext)/bin/msgfmt"

      - name: Build
        run: cmake --build build

      - name: Check that both processor types are in the programs
        run: |
          for f in build/tools/renderham/renderHAM \
                   build/tools/renderhamgui/renderHAM.app/Contents/MacOS/renderHAM; do
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::$f is not universal"; exit 1 ;; esac
          done

      # The runner is an Intel Mac, so this runs the x86_64 part of the programs. The arm64 part is
      # compiled and linked but not run.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build the disk image
        run: WX_LICENCE_DIR="${RUNNER_TEMP}/wx-licences" ./scripts/package_macos.sh build dist

      - name: Open the disk image and start the programs
        run: |
          mnt="$RUNNER_TEMP/renderham-dmg"
          mkdir -p "$mnt" screenshots
          hdiutil attach dist/renderHAM-*-macos-universal.dmg -mountpoint "$mnt" -nobrowse -readonly
          ls -la "$mnt"
          codesign -dv --verbose=2 "$mnt/renderHAM.app" 2>&1 | head -n 12

          # The license texts are in the application (and the signature covers them).
          lic="$mnt/renderHAM.app/Contents/Resources/Licenses"
          ls -R "$lic"
          for f in LICENSE THIRD_PARTY_NOTICES.md wxWidgets/licence.txt wxWidgets/libpng-LICENSE \
                   wxWidgets/zlib-LICENSE wxWidgets/pcre2-LICENCE; do
            test -s "$lic/$f" || { echo "::error::$f is not in the application"; exit 1; }
          done

          "$mnt/Command-line tool/renderHAM" --version
          # A conversion to a file name with a non-ASCII character (u umlaut, written as UTF-8).
          out="$RUNNER_TEMP/Ausgabe-$(printf '\303\274').iff"
          "$mnt/Command-line tool/renderHAM" -i testdata/test_input.png -o "$out"
          test -s "$out"

          # The GUI with a picture; it has to stay up for a few seconds. Then a screenshot - once with
          # the light and once with the dark setting of macOS (the runner is set to dark for the
          # second start, with System Events as the System Settings do it).
          failed=""
          for mode in light dark; do
            if [ "$mode" = dark ]; then
              osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
              sleep 3
            fi
            open -n "$mnt/renderHAM.app" --args "$PWD/testdata/test_input.png"
            sleep 12
            pgrep -x renderHAM && running=yes || running=no
            screencapture -x "screenshots/macos-gui-$mode.png" || echo "screencapture failed"
            pkill -x renderHAM || true
            [ "$running" = yes ] || { echo "::error::renderHAM.app is not running ($mode)"; failed=yes; }
            sleep 2
          done
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
          hdiutil detach "$mnt" -quiet || true
          [ -z "$failed" ] || exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/renderHAM-*-macos-universal.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot-macos
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Draft release
    needs: [check, source, deb, appimage, linux-compat, flatpak, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Name the files and write checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          rm -rf screenshots   # the screenshots of the Windows and macOS runs are not part of a release
          mv renderHAM-x86_64.flatpak "renderHAM-${version}-x86_64.flatpak"
          sha256sum -- * > SHA256SUMS
          ls -l

      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            # The changelog section of this version (Keep a Changelog format).
            awk -v h="## [${version}]" 'index($0, h) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md
            echo
            echo "### Downloads"
            echo
            echo "**Windows (64-bit)**"
            echo
            echo "- \`renderHAM-${version}-windows-x64.zip\`: the GUI and the command-line tool with the DLLs they need; unpack it and start \`renderHAMgui.exe\`. Not signed: Windows SmartScreen asks for confirmation (\"More info\", \"Run anyway\")."
            echo
            echo "**macOS (Intel and Apple Silicon)**"
            echo
            echo "- \`renderHAM-${version}-macos-universal.dmg\`: \`renderHAM.app\` (drag it to Applications) and the command-line tool; macOS 11 or newer. Not signed with a developer certificate: macOS asks for confirmation the first time (see README.txt in the image). The Apple Silicon part has been built but not run by the automated tests."
            echo
            echo "**x86_64 Linux**"
            echo
            echo "- \`renderham_${version}_amd64.deb\`: command-line tool and GUI, built on Ubuntu 22.04: for Ubuntu 22.04 and Linux Mint 21 and newer, Debian 12 and newer (\`sudo apt install ./renderham_${version}_amd64.deb\`)"
            echo "- \`renderHAM-${version}-x86_64.AppImage\`: the GUI as a single file (\`chmod +x\`, then run); built on Ubuntu 22.04, needs glibc 2.35 or newer"
            echo "- \`renderHAM-${version}-x86_64.flatpak\`: the GUI and the command-line tool as a Flatpak (\`flatpak install --user renderHAM-${version}-x86_64.flatpak\`)"
            echo
            echo "**Source code**"
            echo
            echo "- \`renderham-${version}.tar.gz\`: the sources; \`./scripts/install_dependencies.sh\`, \`./scripts/build.sh\` and \`./scripts/install.sh\` build and install them on Debian, Ubuntu, Linux Mint, Fedora, Arch Linux and openSUSE (see the README for other systems)"
            echo
            echo "\`SHA256SUMS\` lists the checksums of all files."
            echo
            echo "This is AI-generated software: the code was written by Claude (Anthropic) under the direction of rawbit (@ravvbit). See the README."
          } > notes.md
          cat notes.md

      - name: Create the draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists already, only updating its files."
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "renderHAM ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
