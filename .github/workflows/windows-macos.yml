#
# Builds renderHAM (library, command-line tool and GUI) on Windows and macOS and runs the test
# suite there: on Windows with MinGW-w64 (MSYS2, UCRT64), on macOS as a universal build (Intel and
# Apple Silicon in one program). This shows that the encoder gives the same results on those systems
# and that the GUI still compiles and links; it does not start the GUI. The Linux packages are
# built by linux-packages.yml.
#
# macOS: the build runs on GitHub's last Intel runner image, so the tests run the Intel part of the
# programs; the Apple Silicon part is compiled and linked but not run. (GitHub did not give this
# repository an Apple Silicon runner within 15 minutes on three tries - macos-latest, macos-15 and
# macos-26 - so a native job could not be added. Try again with `runs-on: macos-15`.) The Intel runner
# images are announced to end in August 2027.
#
# wxWidgets on macOS: Homebrew has no Intel packages of wxWidgets 3.2, so it is built from the
# source tarball here, as a static universal library (the same version and checksum as in the
# Flatpak manifest), and cached. The first run on a new version takes a while (about 20 minutes);
# later runs restore the cache.
#
# Actions are pinned to commit SHAs (the comment names the version); update them deliberately.
name: Windows and macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WX_VERSION: "3.2.12"
  # Keep in step with packaging/linux/flatpak/io.github.ravvbit.renderham.yml.
  WX_SHA256: a62719bb5e1dcc41c1a6fc1eecd499c7ee8521f70402c7b1bb3342a1e16344e0

jobs:
  windows:
    name: Windows (MinGW-w64, UCRT)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (Intel + Apple Silicon)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # The oldest macOS the build targets; wxWidgets and renderHAM are built for the same one.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      WX_PREFIX: ${{ github.workspace }}/wx-prefix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install ninja gettext

      - name: Restore wxWidgets
        id: wx-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.WX_PREFIX }}
          key: wxwidgets-${{ env.WX_VERSION }}-macos-universal-target${{ env.MACOSX_DEPLOYMENT_TARGET }}-v1

      - name: Build wxWidgets
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wx.tar.bz2 \
            "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
          echo "${WX_SHA256}  wx.tar.bz2" | shasum -a 256 -c -
          tar xjf wx.tar.bz2
          cd "wxWidgets-${WX_VERSION}"
          # Static and universal (Intel and Apple Silicon in one), with the bundled copies of the
          # image and compression libraries (nothing from Homebrew ends up in the program), and
          # without the libraries renderHAMgui does not use.
          ./configure --prefix="${WX_PREFIX}" \
            --disable-shared --enable-unicode --disable-sys-libs \
            --enable-universal_binary=x86_64,arm64 \
            --with-macosx-version-min="${MACOSX_DEPLOYMENT_TARGET}" \
            --disable-tests --disable-stc --disable-richtext --disable-ribbon --disable-propgrid \
            --disable-aui --disable-xrc --disable-html --disable-htmlhelp --disable-webview \
            --disable-mediactrl --without-opengl
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DwxWidgets_CONFIG_EXECUTABLE="${WX_PREFIX}/bin/wx-config" \
            -DMSGFMT_EXECUTABLE="$(brew --prefix gettext)/bin/msgfmt"

      - name: Build
        run: cmake --build build

      - name: Check that both processor types are in the programs
        run: |
          for f in build/tools/renderham/renderHAM \
                   build/tools/renderhamgui/renderHAMgui.app/Contents/MacOS/renderHAMgui; do
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::$f is not universal"; exit 1 ;; esac
          done

      # The runner is an Intel Mac, so this runs the x86_64 part of the programs. The arm64 part is
      # compiled and linked but not run.
      - name: Test
        run: ctest --test-dir build --output-on-failure
